<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audio Reader</title>
</head>
<body>
  <script>
    (function() {
      // This page runs in the extension's own context, so getPackageDirectoryEntry is available.
      chrome.runtime.getPackageDirectoryEntry(root => {
        root.getDirectory('audio', {}, dir => {
          const reader = dir.createReader();
          const names = [];
          const readBatch = () => reader.readEntries(entries => {
            if (!entries.length) {
              // Send the list to the parent (content script).
              window.parent.postMessage({ type: 'AUDIO_FILES', files: names }, '*');
              return;
            }
            for (const e of entries) {
              if (e.isFile) names.push(e.name);
            }
            readBatch();
          }, err => {
            console.error('[Reader] readEntries failed:', err);
            window.parent.postMessage({ type: 'AUDIO_FILES', files: [] }, '*');
          });
          readBatch();
        }, err => {
          console.error('[Reader] audio folder not found:', err);
          window.parent.postMessage({ type: 'AUDIO_FILES', files: [] }, '*');
        });
      }, err => {
        console.error('[Reader] getPackageDirectoryEntry failed:', err);
        window.parent.postMessage({ type: 'AUDIO_FILES', files: [] }, '*');
      });
    })();
  </script>
</body>
</html>
